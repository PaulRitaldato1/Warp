# Read once at startup, before the renderer. Edit and relaunch, no rebuild needed.
# Each line sets a console variable, exactly like typing "name value" in the
# console, so anything listed by "help" can go here.

# 1 loads renderdoc.dll at startup so captures work without launching from the
# RenderDoc UI. 0 keeps it out, which Vulkan validation needs: RenderDoc strips
# the validation layer unless its own API Validation option is on.
r.RenderDoc = 1

# D3D12 or Vulkan. D3D12 is Windows only.
r.GraphicsAPI = Vulkan
